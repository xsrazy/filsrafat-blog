---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}</p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">&larr; Kembali ke beranda</a></p>
</article>
